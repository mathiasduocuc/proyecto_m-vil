spring.application.name=api-gateway
server.port=8080
server.address=0.0.0.0
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.instance.hostname=${GATEWAY_HOST:localhost}
eureka.client.fetch-registry=true
spring.cloud.gateway.server.webflux.routes[0].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USUARIOS_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/users
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[0].order=-10
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=${AUTH_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth,/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=registros-service
spring.cloud.gateway.server.webflux.routes[1].uri=${REGISTROS_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/registros,/api/registros/**
spring.cloud.gateway.server.webflux.routes[2].id=estadisticas-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ESTADISTICAS_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/estadisticas,/api/estadisticas/**

jwt.secret=${JWT_SECRET}
